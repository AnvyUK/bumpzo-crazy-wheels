<style>

*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:ui-rounded,'Trebuchet MS',system-ui,-apple-system,Segoe UI,sans-serif;background:#121a3a;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #fff;outline-offset:3px}

#overlay{position:absolute;z-index:6;inset:0;display:flex;align-items:center;justify-content:center;padding:15px;background:rgba(15,24,59,.46);backdrop-filter:blur(8px);transition:opacity .25s}#overlay.hidden{opacity:0;pointer-events:none}#panel{width:min(490px,100%);max-height:calc(100dvh - 25px);overflow:auto;text-align:center;background:linear-gradient(155deg,#fffdf2,#fff0cd);color:var(--ink);border:5px solid #fff;border-radius:34px;padding:29px 26px 25px;box-shadow:0 14px 0 #243276,0 28px 70px #111b44a6;position:relative}#panel:before{content:"";position:absolute;top:18px;left:18px;width:9px;height:9px;border-radius:50%;background:#ffc65a;box-shadow:433px 0 0 #ff9a6f,0 210px 0 #73e0cb,433px 210px 0 #88a6fc;opacity:.75}.logo{font-size:clamp(51px,11vw,78px);letter-spacing:-.095em;margin:0;font-weight:1000;line-height:1.0;-webkit-text-stroke:3px #2e3768;paint-order:stroke fill;color:#ffbe4f;text-shadow:0 5px #ff7b65,0 11px #2c3668,2px 14px 0 #c0af8b;transform:rotate(-3deg);filter:drop-shadow(0 7px 2px #d5d4ba)}.logo em{font-style:normal;color:#74ddcf}.logo b{color:#fc758b;font-weight:1000}.kicker{display:inline-block;margin:8px auto 4px;background:#28386c;color:#fff;font-size:13px;letter-spacing:.24em;font-weight:1000;padding:6px 17px;border-radius:30px;transform:rotate(2deg)}.hero-car{height:145px;display:flex;align-items:center;justify-content:center;position:relative}.hero-car:before{content:"";position:absolute;border-radius:50%;width:236px;height:115px;background:#c8eff0;top:25px;transform:rotate(-9deg)}.hero-car svg{width:230px;height:145px;filter:drop-shadow(0px 13px 1px #bbb8aa)}.panel-heading{font-size:24px;font-weight:1000;letter-spacing:-.04em;margin:16px 0 8px}.panel-sub{font-size:15px;line-height:1.5;font-weight:650;color:#636e86;max-width:360px;margin:7px auto 17px}.primary{border:0;border-radius:18px;padding:15px 24px;min-height:55px;background:linear-gradient(#ffcc4d,#ff9f46);color:#513524;font-size:19px;font-weight:1000;box-shadow:0 6px 0 #dd6734,0 9px 14px #aa763d35;transition:transform .08s;display:inline-flex;align-items:center;justify-content:center;gap:12px}.primary:active{transform:translateY(5px);box-shadow:0 1px 0 #dd6734}.secondary{min-height:47px;padding:10px 17px;border:2px solid #d5deea;border-radius:16px;background:#fff;color:#33426b;font-weight:900;font-size:15px}.buttons{display:flex;justify-content:center;gap:11px;flex-wrap:wrap;margin:10px 0 1px}.tiny{color:#8892a6;font-size:11px;margin-top:18px}.pill-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:13px}.mini-pill{font-size:12px;background:#eff1ed;border-radius:100px;padding:7px 12px;font-weight:900;color:#63708b}#levelGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:20px 0}.level-cell{aspect-ratio:1;border-radius:14px;border:3px solid #fff;box-shadow:0 3px 0 #d4daea;background:#e4ebf4;color:#687894;font-weight:1000;font-size:20px}.level-cell.unlocked{background:linear-gradient(#a5f6e1,#68dabd);color:#244f67}.level-cell.completed{background:linear-gradient(#ffec96,#ffbe56);color:#6e5230}.level-cell.active{outline:3px solid #ff826f;outline-offset:0}.level-cell .star{display:block;font-size:11px;margin-top:2px}#notice{position:absolute;z-index:4;top:112px;left:50%;transform:translateX(-50%);border:2px solid #fff;padding:8px 20px;border-radius:24px;background:#202f66;color:#fff;font-weight:1000;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;box-shadow:0 5px 0 #182351}#notice.on{opacity:1}#footerCredit{position:absolute;bottom:4px;right:8px;opacity:.3;font-size:10px;color:#fff;pointer-events:none}.hidden{display:none!important}
@media(max-width:600px){#hud{padding-top:calc(env(safe-area-inset-top) + 10px);gap:5px}.level-pill,.stat-pill,.icon-btn{height:37px;border-radius:13px}.level-pill{font-size:10px;padding:0 9px;gap:5px}.level-pill strong{font-size:15px}.stat-pill{padding:0 8px;font-size:14px}.stat-pill span{font-size:15px}.icon-btn{width:38px;font-size:17px}.hud-left,.hud-right{gap:5px}#hudProgress{top:calc(env(safe-area-inset-top) + 57px);height:8px}#controls{bottom:calc(20px + env(safe-area-inset-bottom))}.game-btn{height:66px;width:65px;border-radius:20px;font-size:24px}.game-btn.action{width:76px;height:77px;border-radius:23px}.game-btn.mode{width:66px;height:66px}.control-cluster{gap:8px}#tutorialTip{bottom:110px;font-size:11px}#panel{padding:25px 16px 23px;border-radius:28px}.panel-heading{font-size:23px}.hero-car{height:126px}.hero-car svg{width:210px;height:128px}.logo{font-size:56px}.kicker{font-size:11px}}
@media(max-height:620px){#panel{padding-top:12px;padding-bottom:12px}.logo{font-size:47px}.hero-car{height:100px}.hero-car svg{height:103px}.panel-heading{font-size:19px;margin-top:8px}.panel-sub{font-size:13px;margin-bottom:8px}.tiny{margin-top:7px}.game-btn{width:59px;height:59px}.game-btn.action{width:70px;height:70px}.game-btn.mode{width:59px;height:59px}#controls{bottom:8px}#tutorialTip{bottom:87px}#levelGrid{margin:8px 0}}

<body>
<main id="app">
<div id="stage"><canvas id="scene" aria-label="BUMPZO game playfield"></canvas><div id="vignette"></div></div>
<header id="hud">
 <div class="hud-left"><button class="level-pill" id="levelBtn" title="Choose level">LEVEL <strong id="levelNum">01</strong> ▾</button><div class="stat-pill"><span>🪙</span><span id="coinCount">0</span></div></div>
 <div class="hud-right"><div class="stat-pill"><span>🏁</span><span id="timeCount">0:00</span></div><button id="soundBtn" class="icon-btn" aria-label="Toggle sound">♫</button><button id="pauseBtn" class="icon-btn" aria-label="Pause">Ⅱ</button></div>
</header>
<div id="hudProgress"><span id="progressFill"></span></div>
<div id="notice"></div>
<div id="tutorialTip">HOLD ▶ TO DRIVE · TAP JUMP TO FLY!</div>
<div id="controls" aria-label="Game controls">
 <div class="control-cluster"><button class="game-btn" data-key="left" aria-label="Brake or reverse"><span>◀</span><small>BRAKE</small></button><button class="game-btn" data-key="right" aria-label="Accelerate"><span>▶</span><small>GO!</small></button></div>
 <div class="control-cluster"><button class="game-btn mode" id="modeBtn" aria-label="Change car mode"><span class="glyph">⚡</span><small id="modeLabel">GRIP</small></button><button class="game-btn action" data-key="jump" aria-label="Jump"><span class="glyph">↥</span><small>JUMP</small></button></div>
</div>
<div id="overlay"><div id="panel"></div></div>
<div id="footerCredit">BUMPZO! © 2026 · ORIGINAL GAME DEMO</div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), canvas=$('scene'),ctx=canvas.getContext('2d',{alpha:false}), overlay=$('overlay'), panel=$('panel');
const WHEEL=13,H=540, TAU=Math.PI*2;
let w=960,h=540,dpr=1,scale=1,visW=960,cam=0,camTarget=0,frame=0,last=0,noticeTimer=0,shake=0;
let scene='menu', levelIndex=0,level=null,car=null,particles=[],floatTexts=[],finishFireworks=[],elapsed=0,stageCoins=0,deadTimer=0,sound=true,totalCoins=0;
const keys={left:false,right:false,jump:false}, storeKey='bumpzo_save_v1';
let save={unlocked:1,completed:[],best:{},coins:0};
try{const s=JSON.parse(localStorage.getItem(storeKey)||'null');if(s&&typeof s==='object')save={...save,...s};}catch(e){}
save.unlocked=Math.max(1,Math.min(12,Number(save.unlocked)||1));
function persist(){try{localStorage.setItem(storeKey,JSON.stringify(save))}catch(e){}}
const themes=[
{sky1:'#7bd5ed',sky2:'#dff9ed',mount:'#91c4ce',mount2:'#b9d9b4',grass:'#80dfa3',edge:'#3ea880',dirt:'#a47d76',dirt2:'#725b78',sun:'#fff1a0'},
{sky1:'#a09be9',sky2:'#f6d7ec',mount:'#beaad8',mount2:'#e4bdd1',grass:'#afe6a7',edge:'#72b58d',dirt:'#b080a3',dirt2:'#765d99',sun:'#fff2c4'},
{sky1:'#4d99cd',sky2:'#c9e9ef',mount:'#77b3c8',mount2:'#8fd1ce',grass:'#96d7cc',edge:'#4cadab',dirt:'#7f90b3',dirt2:'#536995',sun:'#f9db85'},
{sky1:'#eb9eaa',sky2:'#fde1c1',mount:'#c1a1bd',mount2:'#e5b8ae',grass:'#e4dc88',edge:'#b9ad59',dirt:'#b58877',dirt2:'#805d7e',sun:'#ffe58b'}
];
const levelNames=['BREEZY START','SKY HOP','SUNSET RUN','CLOUD NINE','WILD WHEELS','GOLDEN GATE','BOUNCE CITY','TURBO TRAIL','MOONLIGHT','LOOPY LAND','STAR RACER','FINAL FLIGHT'];
function rng(seed){let s=seed>>>0;return ()=>((s=Math.imul(s,1664525)+1013904223>>>0)/4294967296)}
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function makeLevel(n){
 const r=rng(462+n*3147),segments=[],coins=[],traps=[],springs=[],decor=[];
 let x=0,y=423+Math.sin(n*.8)*14;const num=8+Math.floor(n*.62);
 for(let i=0;i<num;i++){
  const len=(i===0?590:340)+Math.floor(r()*190); const y2=clamp(y+(i===0?0:(r()-.47)*(40+Math.min(n,8)*5)),354,465);
  segments.push({x1:x,x2:x+len,y1:y,y2});
  const s=segments[segments.length-1];
  const nc= i===0?4:3+Math.floor(r()*2);
  for(let c=0;c<nc;c++){
    const cx=x+75+(c+.5)*(len-165)/nc,cy=lerp(y,y2,(cx-x)/len)-67-(c%2)*11;
    coins.push({x:cx,y:cy,t:0,taken:false});
  }

  if(i!==num-1){const gap= (i===0?94:95+Math.min(n,10)*3)+Math.floor(r()*44);x+=len+gap;y=clamp(y2+(r()-.5)*29,355,455);}else{x+=len;}
 }
 const end=x-120;
 if(n>0){const first=segments[0];traps.push({x:355,y:lerp(first.y1,first.y2,355/(first.x2-first.x1)),type:n>5?'saw':'cone'});}
 const lastSeg=segments[segments.length-1];const finalTrapX=lastSeg.x1+(lastSeg.x2-lastSeg.x1)*.48;traps.push({x:finalTrapX,y:lerp(lastSeg.y1,lastSeg.y2,.48),type:n>2?'saw':'cone'});
 for(const s of segments){for(let dx=s.x1+125;dx<s.x2-50;dx+=175){if(r()>.3)decor.push({x:dx,y:lerp(s.y1,s.y2,(dx-s.x1)/(s.x2-s.x1)),kind:r()>.55?'flower':'rock',t:r()*6});}}
 return {n,name:levelNames[n],segments,coins,traps,springs,decor,length:x,finish:end,theme:themes[Math.floor(n/3)%themes.length]};
}
function lerp(a,b,t){return a+(b-a)*t}
function groundAt(x){if(!level)return null;for(const s of level.segments){if(x>=s.x1&&x<=s.x2)return lerp(s.y1,s.y2,(x-s.x1)/(s.x2-s.x1))}return null;}
function slopeAt(x){if(!level)return 0;for(const s of level.segments){if(x>=s.x1&&x<=s.x2)return Math.atan2(s.y2-s.y1,s.x2-s.x1)}return 0;}
function newCar(){const gy=groundAt(90)||424;return {x:90,y:gy-WHEEL,vx:0,vy:0,ang:0,spin:0,grounded:true,mode:0,inv:0,speedGlow:0};}
function setLevel(n){levelIndex=clamp(n,0,11);level=makeLevel(levelIndex);car=newCar();cam=0;camTarget=0;elapsed=0;stageCoins=0;deadTimer=0;particles=[];floatTexts=[];finishFireworks=[];scene='playing';overlay.classList.add('hidden');$('levelNum').textContent=String(n+1).padStart(2,'0');$('coinCount').textContent=save.coins;$('timeCount').textContent='0:00';$('progressFill').style.width='0';$('tutorialTip').textContent=n===0?'HOLD ▶ TO DRIVE · TAP JUMP TO FLY!':'GO!  JUMP!  SWITCH MODES!';$('modeLabel').textContent='GRIP';$('modeBtn').querySelector('.glyph').textContent='⚡';clearKeys();tone(540,.08,'sine',.045);}
function clearKeys(){for(const k in keys){keys[k]=false;document.querySelectorAll('[data-key="'+k+'"]').forEach(b=>b.classList.remove('pressed'));}}
function showNotice(t){const el=$('notice');el.textContent=t;el.classList.add('on');noticeTimer=2.1;}
let audioCtx=null;
function tone(f=440,d=.1,wave='sine',gain=.06,shift=0){if(!sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=wave;o.frequency.setValueAtTime(f,audioCtx.currentTime);if(shift)o.frequency.exponentialRampToValueAtTime(Math.max(1,f+shift),audioCtx.currentTime+d);g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch(e){}}
function coinSound(){tone(860,.085,'sine',.055,430);setTimeout(()=>tone(1170,.11,'sine',.04,200),70)}
function modeSwitch(){if(scene!=='playing')return;car.mode=(car.mode+1)%2;$('modeLabel').textContent=car.mode?'BOUNCE':'GRIP';$('modeBtn').querySelector('.glyph').textContent=car.mode?'✦':'⚡';showNotice(car.mode?'✦ BOUNCE MODE':'⚡ GRIP MODE');tone(car.mode?670:400,.14,'triangle',.075,220);burst(car.x,car.y-12,car.mode?'#ffeb91':'#88f6d9',16);}
function gameOver(){if(scene!=='playing')return;scene='dead';clearKeys();shake=12;const loss=stageCoins;stageCoins=0;level.coins.forEach(c=>c.taken=false);for(let i=0;i<30;i++)particles.push(particle(car.x,car.y-10,'#ffb24c',true));tone(230,.3,'sawtooth',.075,-170);setTimeout(()=>{if(scene==='dead')showPanel('dead',{lost:loss})},650);}
function levelWon(){if(scene!=='playing')return;scene='won';clearKeys();const i=levelIndex;save.completed=[...new Set([...save.completed,i])].sort((a,b)=>a-b);save.unlocked=Math.max(save.unlocked,Math.min(12,i+2));save.coins+=stageCoins;save.best[i]=Math.min(save.best[i]||Infinity,elapsed);persist();$('coinCount').textContent=save.coins;for(let k=0;k<8;k++)setTimeout(()=>{if(scene==='won'){let fx=car.x+(Math.random()-.5)*380,fy=90+Math.random()*180;burst(fx,fy,['#ffcc4b','#82eacc','#ff8baa','#fff'][k%4],25,true)}},k*160);tone(523,.12,'triangle',.08);setTimeout(()=>tone(784,.17,'triangle',.07),160);setTimeout(()=>tone(1046,.28,'triangle',.08),350);setTimeout(()=>{if(scene==='won')showPanel('win')},1250);}
function particle(x,y,color,violent=false){let a=Math.random()*TAU,v=violent?100+Math.random()*250:30+Math.random()*130;return {x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,r:2+Math.random()*5,t:.5+Math.random()*.55,max:1,color,kind:Math.random()>.7?1:0};}
function burst(x,y,color,n=12,violent=false){for(let i=0;i<n;i++)particles.push(particle(x,y,color,violent));}
function textPop(x,y,s,color='#fff'){floatTexts.push({x,y,s,color,t:1.1})}
function dieIfCrash(){if(car.inv>0||scene!=='playing')return;for(const trap of level.traps){if(Math.abs(car.x-trap.x)<28 && Math.abs(car.y-(trap.y-18))<40){gameOver();return;}}}
function update(dt){frame+=dt;if(noticeTimer>0){noticeTimer-=dt;if(noticeTimer<=0)$('notice').classList.remove('on');}
 shake=Math.max(0,shake-dt*36);
 if(scene==='playing'&&car){
  elapsed+=dt;car.inv=Math.max(0,car.inv-dt);
  const ac=car.mode?450:575,top=car.mode?340:405;
  if(keys.right)car.vx=Math.min(top,car.vx+ac*dt);
  else if(keys.left)car.vx=Math.max(-115,car.vx-750*dt);
  else car.vx*=Math.pow(car.grounded?.976:.993,dt*60);
  if(Math.abs(car.vx)<.25)car.vx=0;
  let oldX=car.x,oldBottom=car.y+WHEEL;
  car.x=Math.max(60,car.x+car.vx*dt);
  let gy=groundAt(car.x);
  if(car.grounded){if(gy!=null){const oldG=groundAt(oldX);if(oldG!==null &&Math.abs(gy-oldG)<=25){car.y=gy-WHEEL;car.vy=0;}else car.grounded=false;}else car.grounded=false;}
  if(!car.grounded){car.vy+=(car.mode?880:1140)*dt;car.y+=car.vy*dt;car.ang+=(keys.left?-.65:keys.right?.52:0)*dt;}
  gy=groundAt(car.x);
  if(!car.grounded && gy!==null&&car.vy>=0&&car.y+WHEEL>=gy && oldBottom<=gy+36){car.y=gy-WHEEL;car.vy=0;car.grounded=true;car.ang=slopeAt(car.x);burst(car.x,gy-4,'#ecfff5',6);tone(165,.07,'triangle',.017);}
  if(car.grounded)car.ang=lerp(car.ang,slopeAt(car.x),clamp(dt*7,0,1));else car.ang*=1-dt*.15;
  car.spin+=car.vx*dt/20;car.speedGlow=lerp(car.speedGlow,Math.abs(car.vx)/400,dt*3);
